apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 10
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-container
        image: praveenreddy367/reddy:latest
        ports:
        - containerPort: 5000
